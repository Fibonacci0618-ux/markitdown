<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büroprozesse-Sekretariatsaufgaben – Lernmodul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0f0f17;
  --surface: #1a1a2e;
  --surface2:#16213e;
  --accent:  #e84545;
  --accent2: #ff8c42;
  --green:   #2ec97f;
  --red:     #e84545;
  --text:    #e8e8f0;
  --text2:   #8888aa;
  --border:  #2a2a45;
}
* { box-sizing: border-box; margin:0; padding:0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', Arial, sans-serif;
  min-height: 100vh;
}
h1,h2,h3,.brand,.chapter-title,.opt-label { font-family:'Syne',sans-serif; }
header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 28px; border-bottom:1px solid var(--border);
  position: sticky; top:0; background:var(--bg); z-index:10;
}
.brand { font-weight:800; font-size:1.15rem; color:var(--text); cursor:pointer; }
.brand span { color: var(--accent); }
.screen { display:none; max-width: 980px; margin:0 auto; padding: 28px 24px 90px; }
.screen.active { display:block; }

/* Home */
.stats-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
.stat-card {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 18px; flex:1; min-width:120px;
}
.stat-card .num { font-family:'Syne',sans-serif; font-weight:800; font-size:1.5rem; color:var(--accent); }
.stat-card .lbl { font-size:0.78rem; color:var(--text2); margin-top:2px; }

.action-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.btn-primary, .btn-secondary {
  border:none; border-radius:10px; padding:11px 16px; font-family:'DM Sans',sans-serif;
  font-size:0.88rem; font-weight:700; cursor:pointer; transition:.15s;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#d13838; }
.btn-secondary { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

.search-input {
  width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:0.92rem; margin-bottom:16px;
}
.search-input:focus { outline: 2px solid var(--accent2); outline-offset: 2px; border-color: var(--accent2); }

/* Sichtbarer Fokusindikator für alle interaktiven Elemente (WCAG 2.4.7 / 2.4.11:
   mind. 3:1 Kontrast zum Hintergrund, deutlich sichtbar bei Tastaturbedienung) */
button:focus-visible,
.chapter-card:focus-visible,
.search-result-item:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent2);
  outline-offset: 2px;
}
#searchResults { display:none; margin-bottom:20px; }
.search-result-item {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:12px 16px; margin-bottom:8px; cursor:pointer;
}
.search-result-item:hover { border-color:var(--accent); }
.search-result-chap { font-size:0.74rem; color:var(--accent2); font-weight:700; margin-bottom:4px; }
.search-result-q { font-size:0.88rem; color:var(--text); }
.search-result-q mark { background:var(--accent); color:#fff; border-radius:3px; padding:0 2px; }

.chapter-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.chapter-card {
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:18px; cursor:pointer; transition:.15s; position:relative; overflow:hidden;
}
.chapter-card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 20px rgba(0,0,0,.35); }
.chapter-card::before {
  content:''; position:absolute; top:0; left:0; width:5px; height:100%;
  background: var(--card-color, var(--accent));
}
.chapter-num { font-size:0.72rem; color:var(--text2); font-weight:700; }
.chapter-title { font-size:1rem; font-weight:700; margin:6px 0 10px; line-height:1.3; }
.chapter-progress-bar { height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-bottom:8px; }
.chapter-progress-fill { height:100%; background:var(--card-color, var(--accent)); }
.chapter-meta { font-size:0.76rem; color:var(--text2); display:flex; justify-content:space-between; }

/* Quiz */
.quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.quiz-progress { font-size:0.82rem; color:var(--text2); }
.phase-strip { display:flex; gap:8px; margin-bottom:18px; }
.phase-seg {
  flex:1; text-align:center; padding:8px; border-radius:8px; font-size:0.78rem; font-weight:700;
  background:var(--surface); color:var(--text2); border:1px solid var(--border);
}
.phase-seg.active { background:rgba(232,69,69,.12); color:var(--accent); border-color:var(--accent); }
.phase-seg.done { background:rgba(46,201,127,.1); color:var(--green); border-color:var(--green); }
.bloom-tag {
  display:inline-block; font-size:0.68rem; font-weight:700; padding:3px 9px;
  border-radius:20px; background:var(--surface2); color:var(--accent2); margin-bottom:10px;
}
.question-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; }
.question-text { font-size:1.05rem; font-weight:600; margin-bottom:20px; line-height:1.5; }
.options { display:flex; flex-direction:column; gap:10px; }
.option-btn {
  display:flex; align-items:center; gap:10px; text-align:left;
  background:var(--surface2); border:1.5px solid var(--border); border-radius:10px;
  padding:14px 16px; color:var(--text); font-size:0.92rem; cursor:pointer; transition:.12s;
  font-family:'DM Sans',sans-serif;
}
.option-btn:hover:not(:disabled) {
  border-color:var(--accent2);
  background: rgba(255,140,66,.08);
  transform: translateX(3px);
}
.option-btn:disabled { cursor:default; }
.option-btn.correct { border-color:var(--green); background:rgba(46,201,127,.12); color:var(--green); }
.option-btn.wrong   { border-color:var(--red);   background:rgba(232,69,69,.1);  color:var(--red);   }
.opt-icon { font-weight:800; margin-left:auto; padding-left:10px; flex-shrink:0; }
.explanation-box {
  margin-top:18px; padding:16px; border-radius:10px; background:var(--surface2);
  border-left:3px solid var(--accent2); font-size:0.88rem; line-height:1.55; display:none;
}
.explanation-box.show { display:block; }
.next-btn-row { margin-top:18px; text-align:right; }

/* Results */
.result-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center; }
.result-score { font-family:'Syne',sans-serif; font-weight:800; font-size:2.6rem; color:var(--accent); }
.result-sub { color:var(--text2); margin-top:6px; }
.result-actions { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }

/* Detail */
.detail-tabs { display:flex; gap:8px; margin-bottom:18px; }
.tab-btn {
  padding:9px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
  color:var(--text2); font-size:0.85rem; font-weight:700; cursor:pointer; transition:.15s;
}
.tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.tab-btn:hover:not(.active) { border-color:var(--accent2); color:var(--accent2); transform:translateY(-1px); }
.def-item, .key-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
.def-item strong, .key-item strong { color:var(--accent2); }
.memo-box {
  background:rgba(46,201,127,.08); border-left:3px solid var(--green); border-radius:0 10px 10px 0;
  padding:14px 16px; margin-top:14px; font-style:italic; font-size:0.9rem;
}
.back-link { color:var(--text2); cursor:pointer; font-size:0.85rem; margin-bottom:16px; display:inline-block; }
.back-link:hover { color:var(--accent); }

@media(max-width:480px) {
  header { padding: 12px 14px; }
  #home, #quiz { padding: 20px 14px 70px; }
  #detail { padding: 20px 14px 70px; }
  .action-row { flex-direction: column; }
  .action-row button { width: 100%; }
  .quiz-header { flex-wrap: wrap; gap: 8px; }
  .option-btn { padding: 13px 14px; font-size: 0.88rem; }
  .chapter-grid { grid-template-columns:1fr; }
}

/* Bewegungsempfindlichkeit respektieren (WCAG 2.3.3): Transform-basierte Hover-Effekte
   deaktivieren, Farb-/Rahmen-Feedback bleibt erhalten. */
@media (prefers-reduced-motion: reduce) {
  .chapter-card:hover,
  .option-btn:hover:not(:disabled),
  .tab-btn:hover:not(.active) {
    transform: none;
  }
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header>
  <div class="brand" onclick="goHome()">📘 <span>Büroprozesse</span>-Sekretariatsaufgaben</div>
</header>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statChapters">0/0</div><div class="lbl">Kapitel bearbeitet</div></div>
    <div class="stat-card"><div class="num" id="statAvg">–</div><div class="lbl">Ø Trefferquote</div></div>
    <div class="stat-card"><div class="num" id="statQuestions">0</div><div class="lbl">Fragen gesamt</div></div>
  </div>

  <div class="action-row" id="actionRow">
    <button class="btn-primary" id="reviewBtn" onclick="startReview()">🔁 Fehler wiederholen (<span id="reviewCount">0</span>)</button>
    <button class="btn-secondary" onclick="startExam()">🎲 Zufallsprüfung</button>
    <button class="btn-secondary" onclick="exportAllPDF()">📋 Gesamt-Spickzettel</button>
    <button class="btn-secondary" onclick="exportProgressPDF()">📄 Fortschritt als PDF</button>
    <button class="btn-secondary" onclick="exportProgress()">💾 Fortschritt exportieren</button>
    <button class="btn-secondary" onclick="document.getElementById('importFileInput').click()">📂 Fortschritt importieren</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="importProgress(event)">
  </div>

  <input type="text" id="searchInput" class="search-input" placeholder="🔍 Suche über alle Fragen…" oninput="handleSearch()">
  <div id="searchResults"></div>
  <div class="chapter-grid" id="chapterGrid"></div>
</div>

<!-- QUIZ -->
<div class="screen" id="quiz">
  <div class="quiz-header">
    <span class="back-link" onclick="goHome()">← Zurück</span>
    <span class="quiz-progress" id="quizProgress"></span>
  </div>
  <div id="phaseStripHolder"></div>
  <div class="question-card">
    <div id="bloomTagHolder"></div>
    <div id="originTagHolder"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsHolder"></div>
    <div class="explanation-box" id="explanationBox"></div>
    <div class="next-btn-row" id="nextBtnRow" style="display:none">
      <button class="btn-primary" onclick="nextQuestion()">Weiter →</button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div class="screen" id="results">
  <div class="result-card" id="resultCard"></div>
</div>

<!-- DETAIL -->
<div class="screen" id="detail">
  <span class="back-link" onclick="goHome()">← Zurück</span>
  <h2 id="detailTitle"></h2>
  <div class="detail-tabs">
    <button class="tab-btn active" id="tabInhalt" onclick="switchTab('inhalt')">📖 Inhalt</button>
    <button class="tab-btn" id="tabLernen" onclick="switchTab('lernen')">🎯 Lernen</button>
  </div>
  <div id="detailBody"></div>
</div>

let currentBloomPhase  = 1;

/* ---------- Storage ---------- */
function setStorage(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function getStorage(key) { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
function loadAllResults() { return getStorage(LF_KEY + '_results') || {}; }

function saveChapterResult(chapId, score, total, problems, phase) {
  const all = loadAllResults();
  const percent = total ? Math.round((score/total)*100) : 0;
  all[chapId] = { score, total, percent, ts: Date.now(), problems, phase };
  setStorage(LF_KEY + '_results', all);
}

function recordWrongBank(chId, q, correct) {
  const bank = getWrongBank();
  const key = chId + '::' + q.q;
  if (correct) { delete bank[key]; }
  else { bank[key] = { chId, qText: q.q, ts: Date.now() }; }
  setStorage(LF_KEY + '_wrong', bank);
}
function getWrongBank() { return getStorage(LF_KEY + '_wrong') || {}; }
function getWrongQuestionsList() {
  const bank = getWrongBank();
  const list = [];
  Object.values(bank).forEach(entry => {
    const ch = chapters.find(c => c.id === entry.chId);
    if (!ch) return;
    const q = ch.questions.find(qq => qq.q === entry.qText);
    if (q) list.push({ chId: ch.id, q });
  });
  return list;
}

/* ---------- Navigation ---------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHome() { renderHome(); showScreen('home'); }

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHome() {
  const results = loadAllResults();
  const done = Object.keys(results).filter(k => chapters.some(c=>c.id==k)).length;
  document.getElementById('statChapters').textContent = `${done}/${chapters.length}`;

  const percents = Object.values(results).map(r=>r.percent).filter(p=>typeof p==='number');
  document.getElementById('statAvg').textContent = percents.length
    ? Math.round(percents.reduce((a,b)=>a+b,0)/percents.length) + '%'
    : '–';

  const totalQ = chapters.reduce((s,c)=>s+c.questions.length,0);
  document.getElementById('statQuestions').textContent = totalQ;

  const wrongCount = Object.keys(getWrongBank()).length;
  document.getElementById('reviewCount').textContent = wrongCount;
  document.getElementById('reviewBtn').style.opacity = wrongCount ? '1' : '.5';
  document.getElementById('reviewBtn').style.pointerEvents = wrongCount ? 'auto' : 'none';

  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('chapterGrid').style.display = '';

  const colors = ['#e84545','#ff8c42','#f5c842','#2ec97f','#42b4ff','#b442ff','#ff42b4','#42ffd4','#ff6b35','#35d4ff'];
  const grid = document.getElementById('chapterGrid');
  grid.innerHTML = chapters.map(ch => {
    const r = results[ch.id];
    const pct = r ? r.percent : 0;
    const color = colors[(ch.id - 1) % colors.length];
    return `<div class="chapter-card" style="--card-color:${color}" tabindex="0" role="button"
      aria-label="${escapeHtml(ch.num + ' ' + ch.title)}, ${r ? pct + ' Prozent erreicht' : 'noch nicht bearbeitet'}"
      onclick="showDetail(${ch.id - 1})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDetail(${ch.id - 1})}">
      <div class="chapter-num">${ch.num}</div>
      <div class="chapter-title">${escapeHtml(ch.title)}</div>
      <div class="chapter-progress-bar"><div class="chapter-progress-fill" style="width:${pct}%"></div></div>
      <div class="chapter-meta"><span>${ch.questions.length} Fragen</span><span>${r ? pct+'%' : 'offen'}</span></div>
    </div>`;
  }).join('');
}

function showDetail(idx) {
  currentChapterIdx = idx;
  currentTab = 'inhalt';
  const ch = chapters[idx];
  document.getElementById('detailTitle').textContent = `${ch.num} ${ch.title}`;
  renderDetailTab();
  showScreen('detail');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabInhalt').classList.toggle('active', tab==='inhalt');
  document.getElementById('tabLernen').classList.toggle('active', tab==='lernen');
  renderDetailTab();
}

function renderDetailTab() {
  const ch = chapters[currentChapterIdx];
  const data = cc[ch.id];
  const body = document.getElementById('detailBody');
  if (currentTab === 'inhalt') {
    const defsHtml = (data?.defs||[]).map(([t,d]) => `<div class="def-item"><strong>${escapeHtml(t)}:</strong> ${escapeHtml(d)}</div>`).join('');
    const keysHtml = (data?.keys||[]).map(([t,x]) => `<div class="key-item"><strong>${escapeHtml(t)}:</strong> ${escapeHtml(x)}</div>`).join('');
    body.innerHTML = `${defsHtml}${keysHtml}<div class="memo-box">💡 ${escapeHtml(data?.memo||'')}</div>
      <div style="margin-top:20px">
        <button class="btn-primary" onclick="startChapter(${currentChapterIdx},1)">▶ Phase 1 · Verstehen starten</button>
        <button class="btn-secondary" onclick="startChapter(${currentChapterIdx},2)">▶ Phase 2 · Anwenden starten</button>
        <button class="btn-secondary" onclick="exportPDF(${ch.id})">📋 Spickzettel (Kapitel)</button>
      </div>`;
  } else {
    body.innerHTML = ch.questions.map((q,i) => `
      <div class="def-item">
        <strong>${i+1}. ${escapeHtml(q.q)}</strong><br>
        <span style="color:var(--green)">✓ ${escapeHtml(q.options[q.answer])}</span>
      </div>`).join('');
  }
}

/* ---------- Quiz-Ablauf ---------- */
function startChapter(idx, phase) {
  currentChapterIdx = idx;
  currentBloomPhase = phase;
  currentQuestionIdx = 0;
  sessionAnswers = [];
  phase1Answers = [];
  reviewMode = false;
  examMode = false;
  answered = false;
  renderQuestion();
  showScreen('quiz');
}

function startReview() {
  reviewQuestions = getWrongQuestionsList();
  if (reviewQuestions.length === 0) return;
  examMode = false; reviewMode = true;
  currentQuestionIdx = 0; sessionAnswers = []; answered = false;
  renderQuestion();
  showScreen('quiz');
}

function getAllQuestionsPool() {
  const pool = [];
  chapters.forEach(ch => ch.questions.forEach(q => pool.push({ chId: ch.id, q })));
  return pool;
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startExam() {
  const pool = getAllQuestionsPool();
  let n = parseInt(prompt(`Wie viele Fragen? (5–${pool.length})`, '20'));
  if (isNaN(n)) return;
  n = Math.max(5, Math.min(n, pool.length));
  examQuestions = shuffleArray(pool).slice(0, n);
  reviewMode = false; examMode = true;
  currentQuestionIdx = 0; sessionAnswers = []; answered = false;
  renderQuestion();
  showScreen('quiz');
}

function getCurrentQuestions() {
  if (examMode) return examQuestions.map(e => e.q);
  if (reviewMode) return reviewQuestions.map(e => e.q);
  return getBloomQuestions(currentChapterIdx, currentBloomPhase);
}

function getBloomQuestions(idx, phase) {
  const all = chapters[idx].questions;
  return phase === 1 ? all.filter(q => q.bloom <= 2) : all.filter(q => q.bloom >= 3);
}

function renderQuestion() {
  answered = false;
  const questions = getCurrentQuestions();
  const q = questions[currentQuestionIdx];
  if (!q) { showResultsRouter(); return; }

  document.getElementById('quizProgress').textContent = `Frage ${currentQuestionIdx+1} / ${questions.length}`;

  const phaseHtml = (reviewMode || examMode) ? '' : `
    <div class="phase-strip">
      <div class="phase-seg ${currentBloomPhase===1?'active':'done'}">${currentBloomPhase===1?'▶ ':'✓ '}Phase 1 · Verstehen</div>
      <div class="phase-seg ${currentBloomPhase===2?'active':'inactive'}">${currentBloomPhase===2?'▶ ':'🔒 '}Phase 2 · Anwenden</div>
    </div>`;
  document.getElementById('phaseStripHolder').innerHTML = phaseHtml;

  document.getElementById('bloomTagHolder').innerHTML = `<span class="bloom-tag">Bloom ${q.bloom}</span>`;

  let originTag = '';
  if (examMode) {
    const originCh = chapters.find(c => c.id === examQuestions[currentQuestionIdx].chId);
    if (originCh) originTag = `<span class="bloom-tag" style="margin-left:6px">Kap. ${originCh.num}</span>`;
  } else if (reviewMode) {
    const originCh = chapters.find(c => c.id === reviewQuestions[currentQuestionIdx].chId);
    if (originCh) originTag = `<span class="bloom-tag" style="margin-left:6px">Kap. ${originCh.num}</span>`;
  }
  document.getElementById('originTagHolder').innerHTML = originTag;

  document.getElementById('questionText').textContent = q.q;

  // Optionsreihenfolge bei jedem Rendern neu mischen (verhindert Positions-Bias,
  // z.B. richtige Antwort immer an Position 0). Fisher-Yates auf den Index-Array.
  currentDisplayOrder = shuffleArray(q.options.map((_, i) => i));

  document.getElementById('optionsHolder').innerHTML = currentDisplayOrder.map((origIdx, displayIdx) =>
    `<button class="option-btn" id="opt_${displayIdx}" onclick="selectAnswer(${displayIdx})">
      <span>${escapeHtml(q.options[origIdx])}</span>
    </button>`).join('');
  document.getElementById('explanationBox').classList.remove('show');
  document.getElementById('explanationBox').innerHTML = '';
  document.getElementById('nextBtnRow').style.display = 'none';
}

function selectAnswer(sel) {
  if (answered) return;
  answered = true;
  const questions = getCurrentQuestions();
  const q = questions[currentQuestionIdx];
  const selOrigIdx = currentDisplayOrder[sel];      // angeklickte Position -> Original-Options-Index
  const correct = selOrigIdx === q.answer;
  const correctDisplayIdx = currentDisplayOrder.indexOf(q.answer); // Original-Antwort -> aktuelle Anzeigeposition

  let chId;
  if (examMode) chId = examQuestions[currentQuestionIdx].chId;
  else if (reviewMode) chId = reviewQuestions[currentQuestionIdx].chId;
  else chId = chapters[currentChapterIdx].id;

  currentDisplayOrder.forEach((_, displayIdx) => {
    const btn = document.getElementById(`opt_${displayIdx}`);
    if (btn) {
      btn.disabled = true;
      if (displayIdx === correctDisplayIdx) {
        btn.classList.add('correct');
        btn.insertAdjacentHTML('beforeend', '<span class="opt-icon" aria-hidden="true">✓</span>');
      } else if (displayIdx === sel && !correct) {
        btn.classList.add('wrong');
        btn.insertAdjacentHTML('beforeend', '<span class="opt-icon" aria-hidden="true">✗</span>');
      }
    }
  });

  const explBox = document.getElementById('explanationBox');
  explBox.innerHTML = `<strong>${correct ? '✓ Richtig.' : '✗ Nicht ganz.'}</strong> ${escapeHtml(q.explanation)}`;
  explBox.classList.add('show');
  document.getElementById('nextBtnRow').style.display = 'block';

  recordWrongBank(chId, q, correct);
  sessionAnswers.push({ q, correct, chId });
  if (!reviewMode && !examMode && currentBloomPhase === 1) phase1Answers.push({ q, correct });
}

function nextQuestion() {
  currentQuestionIdx++;
  const questions = getCurrentQuestions();
  if (currentQuestionIdx >= questions.length) {
    showResultsRouter();
  } else {
    renderQuestion();
  }
}

function showResultsRouter() {
  if (examMode) { showExamResults(); return; }
  if (reviewMode) { showReviewResults(); return; }
  if (currentBloomPhase === 1) { showPhaseTransition(); return; }
  showResults();
}

function showPhaseTransition() {
  const p1Score = phase1Answers.filter(a=>a.correct).length;
  const p1Total = phase1Answers.length;
  document.getElementById('resultCard').innerHTML = `
    <h2>Phase 1 abgeschlossen</h2>
    <div class="result-score">${p1Score}/${p1Total}</div>
    <div class="result-sub">richtig in Phase 1 · Verstehen</div>
    <div class="result-actions">
      <button class="btn-primary" id="phase2Btn">Weiter zu Phase 2 · Anwenden →</button>
      <button class="btn-secondary" onclick="goHome()">Zur Startseite</button>
    </div>`;
  document.getElementById('phase2Btn').onclick = () => startChapter(currentChapterIdx, 2);
  showScreen('results');
}

function showResults() {
  const score = sessionAnswers.filter(a=>a.correct).length;
  const total = sessionAnswers.length;
  const chId = chapters[currentChapterIdx].id;
  const problems = sessionAnswers.filter(a=>!a.correct).map(a=>a.q.q);
  saveChapterResult(chId, score, total, problems, currentBloomPhase);
  document.getElementById('resultCard').innerHTML = `
    <h2>Kapitel abgeschlossen</h2>
    <div class="result-score">${score}/${total}</div>
    <div class="result-sub">richtig beantwortet (Phase ${currentBloomPhase})</div>
    <div class="result-actions">
      <button class="btn-secondary" onclick="showDetail(${currentChapterIdx})">Zum Kapitel</button>
      <button class="btn-primary" onclick="goHome()">Zur Startseite</button>
    </div>`;
  showScreen('results');
}

function showReviewResults() {
  const score = sessionAnswers.filter(a=>a.correct).length;
  const total = sessionAnswers.length;
  const remaining = Object.keys(getWrongBank()).length;
  document.getElementById('resultCard').innerHTML = `
    <h2>Wiederholung abgeschlossen</h2>
    <div class="result-score">${score}/${total}</div>
    <div class="result-sub">${remaining === 0 ? 'Alle Fehler aufgeholt! 🎉' : remaining + ' Fragen noch offen'}</div>
    <div class="result-actions">
      ${remaining > 0 ? '<button class="btn-primary" onclick="startReview()">Weiter wiederholen</button>' : ''}
      <button class="btn-secondary" onclick="goHome()">Zur Startseite</button>
    </div>`;
  showScreen('results');
}

function showExamResults() {
  const score = sessionAnswers.filter(a=>a.correct).length;
  const total = sessionAnswers.length;
  document.getElementById('resultCard').innerHTML = `
    <h2>Zufallsprüfung abgeschlossen</h2>
    <div class="result-score">${score}/${total}</div>
    <div class="result-sub">${Math.round((score/total)*100)} % richtig</div>
    <div class="result-actions">
      <button class="btn-primary" onclick="startExam()">Neue Zufallsprüfung</button>
      <button class="btn-secondary" onclick="goHome()">Zur Startseite</button>
    </div>`;
  showScreen('results');
}

/* ---------- Suche ---------- */
function highlightTerm(text, term) {
  const idx = text.toLowerCase().indexOf(term);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx,idx+term.length)) + '</mark>' + escapeHtml(text.slice(idx+term.length));
}

function handleSearch() {
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('chapterGrid');
  const box = document.getElementById('searchResults');

  if (term.length < 2) {
    grid.style.display = ''; box.style.display = 'none'; return;
  }

  const matches = [];
  chapters.forEach(ch => {
    ch.questions.forEach(q => {
      const hay = (q.q + ' ' + q.options.join(' ') + ' ' + q.explanation).toLowerCase();
      if (hay.includes(term)) matches.push({ch, q});
    });
  });

  grid.style.display = 'none'; box.style.display = 'block';
  box.innerHTML = matches.length === 0
    ? `<p style="color:var(--text2)">Keine Treffer für „${escapeHtml(term)}".</p>`
    : matches.slice(0,60).map(({ch,q}) => `
        <div class="search-result-item" tabindex="0" role="button"
          aria-label="Zu Kapitel ${escapeHtml(ch.num)} ${escapeHtml(ch.title)}"
          onclick="showDetail(${ch.id-1})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDetail(${ch.id-1})}">
          <div class="search-result-chap">${ch.num} – ${escapeHtml(ch.title)}</div>
          <div class="search-result-q">${highlightTerm(q.q, term)}</div>
        </div>`).join('');
}

/* ---------- Export ---------- */
function exportPDF(chapterId) {
  const ch = chapters.find(c=>c.id===chapterId);
  const data = cc[chapterId];
  if (!ch || !data) return;
  const defsHtml = data.defs.map(([t,d]) => `<div class="def"><strong>${t}:</strong> ${d}</div>`).join('');
  const keysHtml = data.keys.map(([t,x]) => `<div class="key"><strong>${t}:</strong> ${x}</div>`).join('');
  const html = buildPrintHtml(`${ch.num} ${ch.title}`, `<div class="chapter-block"><h3>${ch.num} ${ch.title}</h3>${defsHtml}${keysHtml}<div class="memo">💡 ${data.memo}</div></div>`);
  const w = window.open('','_blank','width=900,height=700');
  if (w) { w.document.write(html); w.document.close(); }
}

function exportAllPDF() {
  const sections = chapters.map(ch => {
    const data = cc[ch.id];
    if (!data) return '';
    const defsHtml = data.defs.map(([t,d]) => `<div class="def"><strong>${t}:</strong> ${d}</div>`).join('');
    const keysHtml = data.keys.map(([t,x]) => `<div class="key"><strong>${t}:</strong> ${x}</div>`).join('');
    return `<div class="chapter-block"><h3>${ch.num} ${ch.title}</h3>${defsHtml}${keysHtml}<div class="memo">💡 ${data.memo}</div></div>`;
  }).join('');
  const html = buildPrintHtml(`${chapters.length} Kapitel · ${new Date().toLocaleDateString('de-DE')}`, sections);
  const w = window.open('','_blank','width=900,height=700');
  if (w) { w.document.write(html); w.document.close(); }
}

function buildPrintHtml(subtitle, sections) {
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Büroprozesse-Sekretariatsaufgaben – Spickzettel</title>
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1a2e;margin:0;padding:18px;column-count:2;column-gap:26px}
    h1{font-size:20px;color:#e84545;column-span:all}
    h2{font-size:12px;color:#777;font-weight:400;column-span:all}
    .chapter-block{break-inside:avoid;margin-bottom:14px;border-bottom:1px solid #eee;padding-bottom:10px}
    .chapter-block h3{font-size:12.5px;color:#e84545;margin:0 0 6px;font-weight:700}
    .def,.key{font-size:10.5px;line-height:1.4;color:#333;margin-bottom:3px}
    .def strong{color:#2a7a74}.key strong{color:#cc4a1f}
    .memo{font-size:10.5px;font-style:italic;color:#1a6644;background:#f0fdf6;border-left:3px solid #2ec97f;padding:4px 8px;margin-top:6px;border-radius:0 4px 4px 0}
  </style></head><body>
  <h1>Büroprozesse-Sekretariatsaufgaben</h1>
  <h2>${subtitle}</h2>
  ${sections}
  <script>window.onload=()=>window.print()<\/script>
  </body></html>`;
}

function exportProgressPDF() {
  const results = loadAllResults();
  const wrongCount = Object.keys(getWrongBank()).length;
  const done = Object.keys(results).filter(k => chapters.some(c=>c.id==k)).length;
  const percents = Object.values(results).map(r=>r.percent).filter(p=>typeof p==='number');
  const avgPct = percents.length ? Math.round(percents.reduce((a,b)=>a+b,0)/percents.length) : null;
  const totalQ = chapters.reduce((s,c)=>s+c.questions.length,0);

  const rows = chapters.map(ch => {
    const r = results[ch.id];
    const datum = r ? new Date(r.ts).toLocaleDateString('de-DE') : '–';
    const phaseLabel = r ? (r.phase === 1 ? 'Phase 1 · Verstehen' : 'Phase 2 · Anwenden') : '–';
    const statusColor = !r ? '#999' : (r.percent >= 80 ? '#1a8a4a' : r.percent >= 50 ? '#cc7a1f' : '#c0392b');
    return `<tr>
      <td>${ch.num}</td>
      <td>${escapeHtml(ch.title)}</td>
      <td style="text-align:center">${ch.questions.length}</td>
      <td style="text-align:center">${r ? r.score + '/' + r.total : '–'}</td>
      <td style="text-align:center;color:${statusColor};font-weight:700">${r ? r.percent + '%' : 'offen'}</td>
      <td style="text-align:center">${phaseLabel}</td>
      <td style="text-align:center">${datum}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Büroprozesse-Sekretariatsaufgaben – Lernfortschritt</title>
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1a2e;margin:0;padding:24px}
    h1{font-size:22px;color:#c0392b;margin:0 0 4px}
    h2{font-size:13px;color:#777;font-weight:400;margin:0 0 18px}
    .stats{display:flex;gap:16px;margin-bottom:22px}
    .stat{border:1px solid #ddd;border-radius:8px;padding:10px 16px;flex:1}
    .stat .num{font-size:20px;font-weight:700;color:#c0392b}
    .stat .lbl{font-size:11px;color:#777}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#f4f4f4;text-align:left;padding:8px;border-bottom:2px solid #ccc}
    td{padding:7px 8px;border-bottom:1px solid #eee}
    tr:nth-child(even){background:#fafafa}
    .footer-note{margin-top:20px;font-size:10.5px;color:#999}
  </style></head><body>
  <h1>Büroprozesse-Sekretariatsaufgaben</h1>
  <h2>Lernfortschritt · Stand ${new Date().toLocaleDateString('de-DE')}, ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</h2>
  <div class="stats">
    <div class="stat"><div class="num">${done}/${chapters.length}</div><div class="lbl">Kapitel bearbeitet</div></div>
    <div class="stat"><div class="num">${avgPct !== null ? avgPct + '%' : '–'}</div><div class="lbl">Ø Trefferquote</div></div>
    <div class="stat"><div class="num">${totalQ}</div><div class="lbl">Fragen gesamt im Modul</div></div>
    <div class="stat"><div class="num">${wrongCount}</div><div class="lbl">offene Fragen zur Wiederholung</div></div>
  </div>
  <table>
    <thead><tr>
      <th>Kap.</th><th>Titel</th><th>Fragen</th><th>Ergebnis</th><th>Quote</th><th>Zuletzt</th><th>Datum</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="footer-note">Erstellt aus dem lokal gespeicherten Lernfortschritt dieses Browsers/Geräts. Für den Abgleich zwischen Geräten steht zusätzlich der JSON-Export („Fortschritt exportieren") zur Verfügung.</div>
  <script>window.onload=()=>window.print()<\/script>
  </body></html>`;
  const w = window.open('','_blank','width=900,height=700');
  if (w) { w.document.write(html); w.document.close(); }
}

function exportProgress() {
  const data = {
    app: 'Büroprozesse-Sekretariatsaufgaben',
    exportedAt: new Date().toISOString(),
    [LF_KEY + '_results']: getStorage(LF_KEY + '_results') || {},
    [LF_KEY + '_wrong']:   getStorage(LF_KEY + '_wrong') || {}
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bueroprozesse_fortschritt_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('Aktuellen Fortschritt überschreiben?')) return;
      if (data[LF_KEY + '_results']) setStorage(LF_KEY + '_results', data[LF_KEY + '_results']);
      if (data[LF_KEY + '_wrong'])   setStorage(LF_KEY + '_wrong', data[LF_KEY + '_wrong']);
      renderHome();
      alert('Fortschritt importiert.');
    } catch { alert('Datei konnte nicht gelesen werden.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ---------- Init ---------- */
renderHome();
</script>
